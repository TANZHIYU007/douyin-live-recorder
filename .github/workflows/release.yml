name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows Full / Lite
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 校验标签与项目版本
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          from dylive import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != "v" + __version__ or package_version != __version__:
              raise SystemExit(f"标签 {tag} 与项目版本 v{__version__} 不一致")
          if not Path(f"docs/releases/{__version__}.md").is_file():
              raise SystemExit("缺少本版本的发布说明")

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install ".[browser,native,gui,dev]" pyinstaller
          python -m playwright install chromium

      - name: 安装并确认 FFmpeg 环境
        run: |
          choco install ffmpeg -y --no-progress
          where.exe ffmpeg
          where.exe ffprobe
          $toolsRoot = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          $ffmpeg = Get-ChildItem $toolsRoot -Filter ffmpeg.exe -Recurse -File |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw "Chocolatey 包目录中找不到真实 ffmpeg.exe"
          }
          $ffprobe = Join-Path $ffmpeg.DirectoryName "ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) {
            throw "真实 ffmpeg.exe 同目录中找不到 ffprobe.exe"
          }
          "LUMINA_FFMPEG_DIR=$($ffmpeg.DirectoryName)" >> $env:GITHUB_ENV
          Write-Host "将打包真实工具：$($ffmpeg.FullName)"
          & $ffmpeg.FullName -version
          & $ffprobe -version

      - name: 发布前回归（含真实媒体）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:LUMINA_TEST_FFMPEG = Join-Path $env:LUMINA_FFMPEG_DIR "ffmpeg.exe"
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建并验证 Full / Lite
        run: python build_exe.py

      - name: 生成 SHA-256 校验文件
        shell: pwsh
        run: |
          Get-FileHash dist/Lumina-Full.exe, dist/Lumina-Lite.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release create $env:GITHUB_REF_NAME `
            dist/Lumina-Full.exe `
            dist/Lumina-Lite.exe `
            dist/SHA256SUMS.txt `
            --title "拾光 Lumina $env:GITHUB_REF_NAME" `
            --verify-tag `
            --notes-file "docs/releases/$version.md" `
            --generate-notes
